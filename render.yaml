services:
  - type: web # A Python web service named tictactoe
    plan: free
    name: tictactoe
    runtime: python
    repo: https://github.com/jlav/tictactoe.git
    buildCommand: 'uv sync --no-dev'
    startCommand: 'uv run uvicorn main:app --port 10000 --host 0.0.0.0'
    domains:
      - tictactoe.jlaverty.me